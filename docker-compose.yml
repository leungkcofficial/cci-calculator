version: '3'

services:
  cci-calculator:
    build: .
    image: cci-calculator:latest
    container_name: cci-calculator
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./static:/app/static
    environment:
      - MAX_WORKERS=4
      - LOG_LEVEL=INFO
      - MAX_UPLOAD_SIZE=10485760
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_PERIOD=60
      - CORS_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s